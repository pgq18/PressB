# Edit /path/to fields before training. Fresh training: no resume block.
log_name: piper_pap_flow_finetune
log_project: vla_training
model_type: wall-oss
pretrained_wallx_path: /path/to/wall-oss-base
save_path: /path/to/training-output
use_fast_tokenizer: false
action_tokenizer_path: /path/to/fast-tokenizer-only-if-enabled
use_flash_attn: false
profile: false
profile_save_path: /path/to/training-profile
profile_wait_iters: 10
profile_warmup_iters: 5
profile_active_iters: 2
num_warmup_steps: 100
num_training_steps: 64000000
learning_rate: 5.0e-05
min_lr: 5.0e-05
num_epoch: 100
gradient_accumulation_steps: 64
batch_size_per_gpu: 4
padding_side: left
epoch_save_interval: 2
FSDP2: false
torch_compile: false
dof_config:
  joint_1.pos: 1
  joint_2.pos: 1
  joint_3.pos: 1
  joint_4.pos: 1
  joint_5.pos: 1
  joint_6.pos: 1
  gripper.pos: 1
agent_pos_config:
  joint_1.pos: 1
  joint_2.pos: 1
  joint_3.pos: 1
  joint_4.pos: 1
  joint_5.pos: 1
  joint_6.pos: 1
  gripper.pos: 1
norm_stats_path: /path/to/dataset/norm_stats.json
enable_customized_robot_config: true
customized_robot_config:
  name: lerobot/piper
  customized_dof_config:
    joint_1.pos: 1
    joint_2.pos: 1
    joint_3.pos: 1
    joint_4.pos: 1
    joint_5.pos: 1
    joint_6.pos: 1
    gripper.pos: 1
  customized_agent_pos_config:
    joint_1.pos: 1
    joint_2.pos: 1
    joint_3.pos: 1
    joint_4.pos: 1
    joint_5.pos: 1
    joint_6.pos: 1
    gripper.pos: 1
data:
  use_lerobot: true
  lerobot_config:
    repo_id: lerobot/piper
    root: /path/to/piper_pap_lerobot_dataset
    episodes: null
    image_transforms:
      enable: true
      max_num_transforms: 3
      random_order: false
      tfs:
        brightness:
          weight: 1.0
          type: ColorJitter
          kwargs:
            brightness:
            - 0.8
            - 1.2
        contrast:
          weight: 1.0
          type: ColorJitter
          kwargs:
            contrast:
            - 0.8
            - 1.2
        saturation:
          weight: 1.0
          type: ColorJitter
          kwargs:
            saturation:
            - 0.8
            - 1.2
        hue:
          weight: 1.0
          type: ColorJitter
          kwargs:
            hue:
            - -0.05
            - 0.05
        sharpness:
          weight: 1.0
          type: SharpnessJitter
          kwargs:
            sharpness:
            - 0.8
            - 1.2
        affine:
          weight: 1.0
          type: RandomAffine
          kwargs:
            degrees:
            - -3.0
            - 3.0
            translate:
            - 0.05
            - 0.05
    delta_timestamps: null
    tolerance_s: 0.04
    revision: null
    force_cache_sync: false
    download_videos: true
    video_backend: null
  action_horizon: 32
  train_test_split: 0.98
  obs_action_keys:
  - joint_1.pos
  - joint_2.pos
  - joint_3.pos
  - joint_4.pos
  - joint_5.pos
  - joint_6.pos
  - gripper.pos
  predict_action_keys:
  - joint_1.pos
  - joint_2.pos
  - joint_3.pos
  - joint_4.pos
  - joint_5.pos
  - joint_6.pos
  - gripper.pos
  resolution:
    face_view: 256
    left_wrist_view: 256
    right_wrist_view: 256
    move1_view: 256
    move2_view: 256
    top_view: 256
    wall_view: 256
    multi_modal: 256
    up: 256
    wrist: 256
