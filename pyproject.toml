[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pressb"
version = "0.1.0"
description = "PiPER manipulation, frozen VLA inference and online RL with simulation or physical robot environments"
requires-python = ">=3.10,<3.12"
dependencies = ["numpy<2", "scipy", "Pillow", "matplotlib"]

[project.scripts]
pressb = "pressb.experiments.cli:main"
pressb-model-train = "pressb.training.cli:main"

[project.optional-dependencies]
online-rl = ["torch>=2.6", "threadpoolctl>=3", "websockets>=12,<16", "msgpack>=1,<2"]
inference-server = ["websockets>=14,<16", "msgpack>=1,<2"]
real-robot = ["piper_sdk", "pyrealsense2", "websockets>=14,<16", "msgpack>=1,<2"]
pap = ["av", "pyarrow", "websockets>=12,<16", "msgpack>=1,<2"]
table-buttons = ["pin==2.7.0", "hpp-fcl==2.4.4"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["pressb*"]

[tool.setuptools.package-data]
"pressb.model_sources" = ["**/*.py", "**/*.json", "**/*.yaml", "**/*.yml", "**/*.toml", "**/*.txt", "**/*.md", "**/*.cu", "**/*.cuh", "**/*.h", "**/*.sh", "**/LICENSE*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
